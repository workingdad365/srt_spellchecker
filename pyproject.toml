[project]
name = "srt-spellchecker"
version = "0.1.0"
description = "SRT OCR 자막 맞춤법 교정기 (OpenAI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.2.2",
    "openai>=2.0.0",
    "python-dotenv>=1.1.1",
    "pydantic>=2.11.7",
]

[project.scripts]
srt-spellchecker = "srt_spellchecker:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["srt_spellchecker.py"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
