[project]
name = "srt-spellchecker"
version = "0.1.0"
description = "SRT OCR 자막 데스크톱 교정기 (OpenAI / OpenRouter)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.2.2",
    "openai>=2.0.0",
    "python-dotenv>=1.1.1",
    "pydantic>=2.11.7",
    "pyside6>=6.11.2",
    "keyring>=25.6.0",
]

[project.scripts]
srt-spellchecker = "srt_spellchecker:main"

[project.gui-scripts]
srt-spellchecker-gui = "srt_spellchecker_gui:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["srt_spellchecker.py", "ai_services.py", "srt_spellchecker_gui.py", "app_settings.py"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pylint.main]
extension-pkg-allow-list = ["PySide6"]

[tool.pylint.typecheck]
generated-members = ["connect"]
